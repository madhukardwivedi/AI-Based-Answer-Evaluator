services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: answer_evaluator
      POSTGRES_USER: answer_evaluator
      POSTGRES_PASSWORD: answer_evaluator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answer_evaluator -d answer_evaluator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
